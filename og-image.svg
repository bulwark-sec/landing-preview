<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FAFAFA"/>

  <!-- Subtle grid background -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#000" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top status bar (mono) -->
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14" fill="#666">
    <circle cx="80" cy="60" r="5" fill="#3A6A3A"/>
    <text x="98" y="65">v5.32 · 47 ACTIVE ENGAGEMENTS · SOC2 TYPE II · ISO 27001</text>
  </g>

  <!-- BULWARK logo (left) -->
  <g transform="translate(80, 130)">
    <rect width="56" height="56" rx="8" fill="#0A0A0A"/>
    <text x="28" y="40" font-family="Inter, sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle">B</text>
    <text x="76" y="40" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="700" font-size="22" fill="#0A0A0A">bulwark</text>
  </g>

  <!-- Massive headline -->
  <g font-family="Inter, -apple-system, sans-serif" fill="#0A0A0A">
    <text x="80" y="320" font-size="92" font-weight="800" letter-spacing="-3.5">Pentest,</text>
    <text x="80" y="410" font-size="92" font-weight="800" letter-spacing="-3.5" fill="#0A0A0A" opacity="0.55">on autopilot.</text>
  </g>

  <!-- Lede -->
  <g font-family="Inter, sans-serif" font-size="22" fill="#666">
    <text x="80" y="475">Autonomous external pentest agent.</text>
    <text x="80" y="505">Point it at an authorized target. Walk away. Come back to a clean report.</text>
  </g>

  <!-- Bottom: preflight mono bar -->
  <g transform="translate(80, 570)">
    <rect width="1040" height="1" fill="#0A0A0A" opacity="0.08"/>
  </g>
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="13" fill="#666" transform="translate(80, 595)">
    <text x="0" y="0" fill="#999">PREFLIGHT</text>
    <text x="100" y="0" fill="#666">scope-validation</text>
    <text x="240" y="0" fill="#666">·</text>
    <text x="260" y="0" fill="#666">authorization</text>
    <text x="380" y="0" fill="#666">·</text>
    <text x="400" y="0" fill="#666">signed</text>
    <text x="460" y="0" fill="#666">·</text>
    <text x="480" y="0" fill="#666">audit-log committed</text>
    <text x="660" y="0" fill="#666">·</text>
    <text x="680" y="0" fill="#0A0A0A">getwark.com →</text>
  </g>
</svg>
